services:
  - type: web
    name: student-performance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn student_performance_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
